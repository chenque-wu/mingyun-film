<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>易经 · 六步（三分半 16:9）</title>
<style>html,body{margin:0;background:#0b0d11;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// 《易经 · 六步》三分半 16:9 · 代码生成
// 内容：乾卦六爻 = 一件事的六个阶段（生活语言，零术语）；技术层：六十四卦 = 六位二进制（莱布尼茨 1703 年读到易经后指出）
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { alpha: false });
  const W = 1920, H = 1080, DUR = 210, FPS = 24;
  const KAI = '"KaiTi","STKaiti","Kaiti SC",serif';
  const SANS = '"Microsoft YaHei","PingFang SC",system-ui,sans-serif';
  const MONO = '"Consolas","Courier New",monospace';
  const INK = '#0b0d11', BONE = '#f3ede2', ZHU = '#cf4327', BRONZE = '#b8935a', MUTE = 'rgba(243,237,226,.55)';
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;

  // ── 真算：六位二进制 → 六十四卦 ──
  const BITS = ['1','1','1','1','1','1'];              // 乾：六爻皆阳
  const PATTERNS = 2 ** 6;                             // 64（本片技术层引用的真实数字）
  // 每爻的一句话（生活语言）+ 爻辞
  const YAO = [
    { t: '初九 · 潜龙勿用', s: '刚冒头的时候，最该做的是不着急' },
    { t: '九二 · 见龙在田', s: '开始被人看见了' },
    { t: '九三 · 终日乾乾', s: '白天做事，晚上复盘——这段最难熬' },
    { t: '九四 · 或跃在渊', s: '跳，还是不跳' },
    { t: '九五 · 飞龙在天', s: '风来了，别客气' },
    { t: '上九 · 亢龙有悔', s: '最高的地方，也最冷' },
  ];
  // 时间轴：开场 0-24；六爻 24-192（每爻 28 秒）；收束 192-210
  const Y0 = 24, YD = 28;
  const yaoAt = i => [Y0 + i * YD, Y0 + i * YD + YD];
  const END0 = 192;

  const SUB = [
    [1.0, 8.0, '《易经》讲的不是算命'],
    [9.0, 16.0, '它讲的是一件事怎么长大、怎么老去'],
    [17.0, 24.0, '任何一件事，它都分成六步'],
    ...YAO.map((y, i) => [yaoAt(i)[0] + 0.6, yaoAt(i)[0] + 12.0, y.s]),
    ...YAO.map((y, i) => [yaoAt(i)[0] + 13.0, yaoAt(i)[1] - 1.0, y.t]),
    [193.0, 200.0, '穷则变，变则通，通则久 —— 《系辞》'],
    [201.0, 210.0, '你现在，在第几步？'],
  ];

  // ── 质感 ──
  const noise = (() => { const c = document.createElement('canvas'); c.width = c.height = 220; const g = c.getContext('2d'), d = g.createImageData(220, 220);
    for (let i = 0; i < d.data.length; i += 4) { const v = 120 + Math.random() * 70; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 16; }
    g.putImageData(d, 0, 0); return c; })();
  function screen(t, tint) {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * .42, H * .5, 60, W * .5, H * .5, W * .78);
    g.addColorStop(0, tint); g.addColorStop(1, 'rgba(11,13,17,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function grade() {
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .45; ctx.drawImage(noise, 0, 0, W, H); ctx.restore();
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .40, W / 2, H / 2, H * .98);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.58)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function T(s, x, y, o = {}) {
    const { size = 44, font = SANS, color = BONE, align = 'left', alpha = 1, ls = 0, weight = '400' } = o;
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${font}`;
    if (ls) { let tot = 0; for (const ch of s) tot += ctx.measureText(ch).width + ls;
      let cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
      for (const ch of s) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + ls; } }
    else { ctx.textAlign = align; ctx.fillText(s, x, y); }
    ctx.restore();
  }
  function sub(t) {
    const s = SUB.find(([a, b]) => t >= a && t <= b);
    if (!s) return;
    const k = Math.min(seg(t, s[0], s[0] + .3), 1 - seg(t, s[1] - .3, s[1]));
    ctx.save(); ctx.globalAlpha = .55 * k; ctx.fillStyle = '#000'; ctx.fillRect(0, 906, W, 174); ctx.restore();
    T(s[2], W / 2, 1014, { size: 68, font: SANS, color: BONE, align: 'center', alpha: k, ls: 2 });
  }
  // 爻：阳爻一条实线，阴爻两条断线；带笔触生长
  function yaoLine(x, y, w, h, yang, k, color) {
    ctx.save(); ctx.fillStyle = color;
    if (yang) ctx.fillRect(x, y, w * ease(k), h);
    else {
      const half = (w - 46) / 2;
      ctx.fillRect(x, y, half * ease(Math.min(1, k * 1.6)), h);
      ctx.fillRect(x + w - half * ease(Math.max(0, (k - .35) / .65)), y, half * ease(Math.max(0, (k - .35) / .65)), h);
    }
    ctx.restore();
  }
  // 生命曲线：升至五爻最高，上爻回落（真实由阶段序号计算，不是贴图）
  function lifeCurve(t) {
    ctx.save(); ctx.strokeStyle = 'rgba(184,147,90,.5)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    const x0 = 300, y0 = 860, w = 1320, h = 430;
    const upto = Math.min(1, (t - Y0) / (6 * YD));
    for (let i = 0; i <= 160 * upto; i++) {
      const x = i / 160;
      const stage = x * 6;                                  // 0..6 步
      const y = stage <= 5 ? Math.pow(stage / 5, .85) : 1 - (stage - 5) * .62;
      const px = x0 + w * x, py = y0 - h * y * .82;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke(); ctx.restore();
  }
  function hud(t) {
    T('易经 · 六步', 120, 92, { size: 26, font: SANS, color: MUTE, ls: 3 });
    const cur = t < Y0 ? 0 : Math.min(6, Math.floor((t - Y0) / YD) + 1);
    T(cur ? `第 ${cur} 步 / 6` : '起', W - 120, 92, { size: 26, font: SANS, color: BRONZE, align: 'right', ls: 3 });
    ctx.save(); ctx.fillStyle = 'rgba(243,237,226,.14)'; ctx.fillRect(120, 1032, W - 240, 4);
    ctx.fillStyle = ZHU; ctx.fillRect(120, 1032, (W - 240) * (t / DUR), 4); ctx.restore();
  }

  function render(t) {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    ctx.save();
    const zoom = 1.03 + Math.sin(t * .05) * .004 + (t / DUR) * .012;
    ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);

    if (t < Y0) {
      // 开场：一个卦象从无到有生长（六爻逐条画出）
      screen(t, 'rgba(30,26,20,.6)');
      const cx = W / 2, top = 360, lw = 460, lh = 30, gap = 34;
      for (let i = 0; i < 6; i++) {
        const k = seg(t, 6 + i * 1.5, 9 + i * 1.5);
        yaoLine(cx - lw / 2, top + i * (lh + gap), lw, lh, true, k, i < 5 ? BONE : ZHU);
      }
      T('《易经》', W / 2, 220, { size: 96, font: KAI, color: BONE, align: 'center', ls: 20, alpha: ease(seg(t, .6, 3)) });
      T('讲的不是算命，是一件事怎么长大、怎么老去', W / 2, 300, { size: 40, font: SANS, color: MUTE, align: 'center', ls: 3, alpha: ease(seg(t, 9, 11)) });
      T('任何一件事，它都分成六步', W / 2, 880, { size: 56, font: KAI, color: BRONZE, align: 'center', ls: 8, alpha: ease(seg(t, 17, 19)) });
    } else if (t < END0) {
      const idx = Math.min(5, Math.floor((t - Y0) / YD));
      const [a, b] = yaoAt(idx);
      screen(t, idx < 5 ? 'rgba(34,28,20,.58)' : 'rgba(60,22,16,.62)');
      lifeCurve(t);
      // 六爻：已亮的常亮，当前爻笔触生长
      const cx = W / 2 - 470, top = 330, lw = 380, lh = 26, gap = 30;
      for (let i = 0; i < 6; i++) {
        const k = i < idx ? 1 : i === idx ? seg(t, a + .4, a + 2.4) : 0;
        if (k <= 0) { ctx.save(); ctx.globalAlpha = .10; yaoLine(cx - lw / 2, top + i * (lh + gap), lw, lh, i !== 5, 1, BONE); ctx.restore(); }
        else yaoLine(cx - lw / 2, top + i * (lh + gap), lw, lh, i !== 5, k, i === idx ? ZHU : BONE);
      }
      // 当前爻的文与话
      T(YAO[idx].t, cx + 300, 420, { size: 64, font: KAI, color: idx === 5 ? ZHU : BRONZE, ls: 8, alpha: ease(seg(t, a + 2.2, a + 3.6)) });
      T(YAO[idx].s, cx + 300, 520, { size: 52, font: SANS, color: BONE, ls: 2, alpha: ease(seg(t, a + 3.2, a + 4.6)) });
      T(`第 ${idx + 1} / 6 步`, cx + 300, 620, { size: 30, font: MONO, color: MUTE, ls: 2, alpha: ease(seg(t, a + 4.4, a + 5.6)) });
      // 技术层：六位二进制（真实）
      if (idx >= 4) {
        T('六爻 = 六位二进制', 1180, 880, { size: 28, font: SANS, color: MUTE, ls: 2, alpha: ease(seg(t, a + 5, a + 6.4)) });
        T(`${BITS.join('')} = 63`, 1180, 940, { size: 46, font: MONO, color: BRONZE, alpha: ease(seg(t, a + 5.6, a + 7)) });
        T(`2^6 = ${PATTERNS} 卦`, 1180, 990, { size: 26, font: MONO, color: MUTE, alpha: ease(seg(t, a + 6.2, a + 7.6)) });
      }
    } else {
      // 收束
      screen(t, 'rgba(46,22,16,.66)');
      const cx = W / 2, top = 300, lw = 300, lh = 22, gap = 26;
      for (let i = 0; i < 6; i++) yaoLine(cx - lw / 2, top + i * (lh + gap), lw, lh, true, 1, i < 5 ? BONE : ZHU);
      T('穷则变，变则通，通则久', W / 2, 660, { size: 92, font: KAI, color: BONE, align: 'center', ls: 14, alpha: ease(seg(t, 193, 195.4)) });
      T('《系辞》', W / 2, 726, { size: 34, font: SANS, color: MUTE, align: 'center', ls: 6, alpha: ease(seg(t, 194.6, 196.4)) });
      T('它不是让你认命的', W / 2, 830, { size: 46, font: SANS, color: BRONZE, align: 'center', ls: 4, alpha: ease(seg(t, 196.6, 198.4)) });
      T('是让你看懂自己在第几步', W / 2, 892, { size: 46, font: SANS, color: BRONZE, align: 'center', ls: 4, alpha: ease(seg(t, 197.4, 199.2)) });
      T('你现在，在第几步？', W / 2, 990, { size: 72, font: KAI, color: ZHU, align: 'center', ls: 12, alpha: ease(seg(t, 201, 203.4)) });
    }
    ctx.restore();
    grade(); hud(t); sub(t);
  }

  const beats = [{ t: 6, k: 'rise' }, { t: 17, k: 'rise' }, ...YAO.map((_, i) => ({ t: Y0 + i * YD + 2.4, k: 'tick' })), { t: 193, k: 'gong' }];
  window.__film = { ready: false, dur: DUR, fps: FPS, beats, title: '易经 · 六步', setTime: t => { render(Math.max(0, Math.min(DUR, t))); return true; } };
  document.fonts.ready.then(() => { render(0); window.__film.ready = true; }).catch(() => { render(0); window.__film.ready = true; });
})();
</script>
</body>
</html>
